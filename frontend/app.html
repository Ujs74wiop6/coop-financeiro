<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Financeiro da Cooperativa</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo">
    <strong>Financeiro · Cooperativa</strong>
    <div class="topo-usuario">
      <span id="nome-usuario"></span>
      <button id="btn-sair" class="btn btn-secundario">Sair</button>
    </div>
  </header>

  <nav class="abas">
    <button class="aba ativa" data-tela="tela-contas">Contas a Pagar</button>
    <button class="aba" data-tela="tela-planos">Plano de Contas</button>
  </nav>

  <main class="conteudo">

    <!-- ===================== CONTAS A PAGAR ===================== -->
    <section id="tela-contas">
      <div class="resumo">
        <div class="card-resumo"><span>Em aberto</span><strong id="res-aberto">-</strong></div>
        <div class="card-resumo alerta"><span>Vencidas</span><strong id="res-vencidas">-</strong></div>
        <div class="card-resumo ok"><span>Pagas</span><strong id="res-pagas">-</strong></div>
      </div>

      <div class="barra">
        <input id="busca-conta" type="search" placeholder="Buscar por descrição...">
        <select id="filtro-status">
          <option value="">Todas</option>
          <option value="aberto">Em aberto</option>
          <option value="vencida">Vencidas</option>
          <option value="paga">Pagas</option>
        </select>
        <button id="btn-nova-conta" class="btn btn-primario">+ Nova conta</button>
      </div>

      <div class="tabela-wrap">
        <table>
          <thead>
            <tr>
              <th>Descrição</th><th>Plano de contas</th><th>Vencimento</th>
              <th class="num">Valor</th><th>Status</th><th class="acoes">Ações</th>
            </tr>
          </thead>
          <tbody id="tbody-contas"></tbody>
        </table>
      </div>
    </section>

    <!-- ===================== PLANO DE CONTAS ===================== -->
    <section id="tela-planos" hidden>
      <div class="barra">
        <input id="busca-plano" type="search" placeholder="Buscar por código ou nome...">
        <button id="btn-novo-plano" class="btn btn-primario">+ Novo plano</button>
      </div>

      <div class="tabela-wrap">
        <table>
          <thead>
            <tr><th>Código</th><th>Nome</th><th class="acoes">Ações</th></tr>
          </thead>
          <tbody id="tbody-planos"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- ===================== FORMULÁRIO: CONTA A PAGAR ===================== -->
  <dialog id="dlg-conta">
    <form id="form-conta" method="dialog" novalidate>
      <h2 id="titulo-conta">Nova conta a pagar</h2>

      <label for="conta-descricao">Descrição</label>
      <input id="conta-descricao" type="text" maxlength="150" required>

      <label for="conta-plano">Plano de contas</label>
      <select id="conta-plano" required></select>

      <div class="duas-colunas">
        <div>
          <label for="conta-valor">Valor (R$)</label>
          <input id="conta-valor" type="number" step="0.01" min="0.01" required>
        </div>
        <div>
          <label for="conta-vencimento">Vencimento</label>
          <input id="conta-vencimento" type="date" required>
        </div>
      </div>

      <label class="check"><input id="conta-pago" type="checkbox"> Já foi paga</label>

      <p id="erro-conta" class="erro" role="alert" hidden></p>
      <div class="rodape-dialogo">
        <button type="button" class="btn btn-secundario" data-fechar="dlg-conta">Cancelar</button>
        <button type="submit" class="btn btn-primario">Salvar</button>
      </div>
    </form>
  </dialog>

  <!-- ===================== FORMULÁRIO: PLANO DE CONTAS ===================== -->
  <dialog id="dlg-plano">
    <form id="form-plano" method="dialog" novalidate>
      <h2 id="titulo-plano">Novo plano de contas</h2>

      <label for="plano-codigo">Código</label>
      <input id="plano-codigo" type="text" maxlength="20" placeholder="ex.: 3.1.01" required>

      <label for="plano-nome">Nome</label>
      <input id="plano-nome" type="text" maxlength="100" required>

      <p id="erro-plano" class="erro" role="alert" hidden></p>
      <div class="rodape-dialogo">
        <button type="button" class="btn btn-secundario" data-fechar="dlg-plano">Cancelar</button>
        <button type="submit" class="btn btn-primario">Salvar</button>
      </div>
    </form>
  </dialog>

  <!-- ===================== CONFIRMAR EXCLUSÃO ===================== -->
  <dialog id="dlg-confirma">
    <form method="dialog">
      <h2>Confirmar exclusão</h2>
      <p id="texto-confirma"></p>
      <p id="erro-confirma" class="erro" role="alert" hidden></p>
      <div class="rodape-dialogo">
        <button type="button" class="btn btn-secundario" data-fechar="dlg-confirma">Cancelar</button>
        <button type="button" id="btn-confirmar" class="btn btn-perigo">Excluir</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
